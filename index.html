<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Whack Your Boss v1.0</title>

    <script src="ruffle.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #ffffff; /* PURE WHITE */
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Center the flash container */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #flash-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Make the Ruffle player follow the viewport dimensions. */
        #flash-container > ruffle-player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="flash-container"></div>

<script>
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.style.width = "100%";
    player.style.height = "100%";

    const container = document.getElementById("flash-container");
    container.appendChild(player);

    player.load("wybmodded.swf");

    // Fullscreen is only allowed automatically when the browser grants it.
    // A rejected request must not prevent the SWF from loading.
    async function tryFullscreen() {
        if (document.fullscreenElement || !player.requestFullscreen) return;

        try {
            await player.requestFullscreen();
        } catch (_) {
            // Browsers commonly reject fullscreen until the user interacts.
        }
    }

    // Try when loaded, then retry once from a user gesture if the browser blocked it.
    player.addEventListener("loaded", tryFullscreen, { once: true });
    document.addEventListener("click", tryFullscreen, { once: true });
</script>

</body>
</html>
