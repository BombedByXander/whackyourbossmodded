<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Whack Your Boss v1.0</title>

    <script src="ruffle.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #080808;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Center the flash container */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #flash-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Make the Ruffle player follow the viewport dimensions. */
        #flash-container > ruffle-player {
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 500ms ease;
        }

        #flash-container > ruffle-player.is-ready {
            opacity: 1;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at center, #252525 0%, #080808 72%);
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            letter-spacing: 0.18em;
            transition: opacity 550ms ease, visibility 550ms ease;
        }

        #loading-screen.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #effects-layer {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            overflow: hidden;
        }

        .ceiling-tile {
            position: absolute;
            top: -130px;
            width: 112px;
            height: 28px;
            border: 3px solid #8d9299;
            border-radius: 3px;
            background: repeating-linear-gradient(90deg, #d9dde1 0 26px, #b5bac1 27px 29px);
            box-shadow: 0 10px 14px rgb(0 0 0 / 35%);
            transform: rotate(-3deg);
            animation: tile-drop 650ms cubic-bezier(.2,.8,.25,1) forwards;
        }

        #effects-layer.impact {
            animation: impact-shake 280ms ease-in-out;
        }

        .impact-flash {
            position: absolute;
            left: 50%;
            top: 68%;
            width: 170px;
            height: 70px;
            border-radius: 50%;
            background: rgb(255 255 255 / 75%);
            transform: translate(-50%, -50%);
            animation: impact-fade 420ms ease-out forwards;
        }

        @keyframes tile-drop {
            to { top: 64%; transform: rotate(2deg); }
        }

        @keyframes impact-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @keyframes impact-fade {
            from { opacity: 1; transform: translate(-50%, -50%) scale(.7); }
            to { opacity: 0; transform: translate(-50%, -50%) scale(1.7); }
        }

        .loading-content {
            display: grid;
            justify-items: center;
            gap: 22px;
            text-align: center;
        }

        .loading-dots {
            display: flex;
            gap: 8px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff665e;
            animation: loading-pulse 900ms ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 150ms; }
        .loading-dots span:nth-child(3) { animation-delay: 300ms; }

        @keyframes loading-pulse {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-5px); }
        }
    </style>
</head>
<body>

<div id="loading-screen" role="status" aria-live="polite">
    <div class="loading-content">
        <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
</div>

<div id="flash-container"></div>
<div id="effects-layer" aria-hidden="true"></div>

<script>
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    player.style.width = "100%";
    player.style.height = "100%";

    const container = document.getElementById("flash-container");
    const loadingScreen = document.getElementById("loading-screen");
    const effectsLayer = document.getElementById("effects-layer");
    container.appendChild(player);

    let gameRevealed = false;
    function revealGame() {
        if (gameRevealed) return;
        gameRevealed = true;
        player.classList.add("is-ready");
        loadingScreen.classList.add("is-hidden");
        tryFullscreen();
    }

    let gameLoaded = false;
    function finishLoading() {
        if (gameLoaded) return;
        gameLoaded = true;
        // Let the SWF's old intro finish behind the branded loading screen.
        window.setTimeout(revealGame, 7600);
    }

    const loadResult = player.load("wybmodded.swf");

    // Prefer the load promise; some Ruffle builds do not dispatch `loaded`.
    if (loadResult && typeof loadResult.then === "function") {
        loadResult.then(finishLoading).catch(finishLoading);
    }

    // Keep the event as a compatibility fallback for older Ruffle builds.
    player.addEventListener("loaded", finishLoading, { once: true });

    // Never leave the user on a loading screen if the SWF reports no event.
    window.setTimeout(revealGame, 15000);

    // Fullscreen is only allowed automatically when the browser grants it.
    // A rejected request must not prevent the SWF from loading.
    async function tryFullscreen() {
        if (document.fullscreenElement || !player.requestFullscreen) return;

        try {
            await player.requestFullscreen();
        } catch (_) {
            // Browsers commonly reject fullscreen until the user interacts.
        }
    }

    // Try when loaded, then retry once from a user gesture if the browser blocked it.
    document.addEventListener("click", tryFullscreen, { once: true });

    // Cartoon ceiling trap: clicks in the top 18% of the game drop a ceiling tile.
    let ceilingTrapUsed = false;
    player.addEventListener("click", (event) => {
        if (ceilingTrapUsed || event.clientY > window.innerHeight * 0.18) return;
        ceilingTrapUsed = true;

        const tile = document.createElement("div");
        tile.className = "ceiling-tile";
        tile.style.left = `${Math.max(8, Math.min(window.innerWidth - 120, event.clientX - 56))}px`;
        effectsLayer.appendChild(tile);

        window.setTimeout(() => {
            effectsLayer.classList.add("impact");
            const flash = document.createElement("div");
            flash.className = "impact-flash";
            effectsLayer.appendChild(flash);
        }, 640);

        window.setTimeout(() => effectsLayer.remove(), 2200);
    });
</script>

</body>
</html>
